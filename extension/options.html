<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Satchel settings</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main class="sheet">
      <header class="masthead">
        <div class="brand">
          <svg class="die" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="0.75" y="0.75" width="14.5" height="14.5" rx="3.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <text x="8" y="12" text-anchor="middle" font-family="Besley" font-weight="800" font-size="11" fill="currentColor">S</text>
          </svg>
          <span>Satchel</span>
        </div>
        <h1>Settings</h1>
      </header>

      <form id="settings" class="fields" novalidate>
        <div class="field">
          <label for="worker-url">Worker URL</label>
          <input id="worker-url" name="workerUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://satchel.you.workers.dev" />
        </div>
        <div class="field">
          <label for="key">Save key</label>
          <div class="secret">
            <input id="key" name="key" type="password" autocomplete="off" spellcheck="false" />
            <button id="show-key" class="reveal" type="button" aria-controls="key" aria-pressed="false">Show</button>
          </div>
        </div>

        <div class="actions">
          <button id="save" class="row" type="submit">
            <span class="label">Save</span>
            <kbd class="cap cap-wide">enter</kbd>
          </button>
          <button id="test" class="row" type="button" aria-keyshortcuts="T">
            <span class="label">Test</span>
            <kbd class="cap">T</kbd>
          </button>
        </div>
      </form>

      <section class="report" role="status" aria-live="polite">
        <p id="status"></p>
        <ul id="results"></ul>
      </section>

      <footer class="foot">Kept in this Chrome profile only, never synced.</footer>
    </main>
  </body>
</html>
